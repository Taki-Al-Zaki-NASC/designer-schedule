<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="UYFSR schedule and poster submission dashboard — rotation, topics, review and backups." />
    <title>UYFSR · Schedule &amp; Submission Dashboard</title>

    <link id="faviconLink" rel="icon" type="image/jpeg" href="favicon.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/app.css" />
</head>

<body>

    <!-- ───────────────────────────────────────────── top bar ── -->
    <header class="topbar">
        <div class="topbar__inner">
            <div class="brand">
                <img src="logo.png" alt="" class="brand__logo" id="brandLogo"
                     onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22%3E%3Crect width=%2240%22 height=%2240%22 rx=%2210%22 fill=%22%232f6bff%22/%3E%3Ctext x=%2220%22 y=%2226%22 font-size=%2215%22 font-family=%22sans-serif%22 font-weight=%22700%22 fill=%22white%22 text-anchor=%22middle%22%3EUY%3C/text%3E%3C/svg%3E'" />
                <div class="brand__text">
                    <h1>Schedule &amp; Submission</h1>
                    <p>UYFSR poster rotation</p>
                </div>
            </div>

            <div class="clock" id="clock" aria-label="Local time"></div>
            <div class="conn" id="conn" role="status">Connecting…</div>
            <button class="btn btn--ghost btn--sm" id="authBtn" data-action="auth">
                <i data-lucide="lock"></i> Admin sign in
            </button>
        </div>
    </header>

    <main class="shell">

        <!-- ─────────────────────────────────────────── tabs ── -->
        <nav class="tabs" id="tabs" role="tablist" aria-label="Sections">
            <button class="tab is-active" data-tab="schedule" role="tab" aria-selected="true">
                <i data-lucide="layout-grid"></i> Schedule
            </button>
            <button class="tab" data-tab="roster" role="tab" aria-selected="false">
                <i data-lucide="users-round"></i> Roster
            </button>
            <button class="tab" data-tab="controls" role="tab" aria-selected="false" data-owner="true" hidden>
                <i data-lucide="sliders-horizontal"></i> Controls
            </button>
            <button class="tab" data-tab="backup" role="tab" aria-selected="false" data-owner="true" hidden>
                <i data-lucide="database-backup"></i> Backup
            </button>
            <button class="tab" data-tab="activity" role="tab" aria-selected="false" data-owner="true" hidden>
                <i data-lucide="scroll-text"></i> Activity
            </button>
        </nav>

        <!-- ─────────────────────────────────────── schedule ── -->
        <section id="view-schedule" role="tabpanel" aria-label="Schedule" class="stack">

            <div class="toolbar" id="monthBar">
                <div class="monthNav">
                    <button data-action="prev-month" aria-label="Previous month"><i data-lucide="chevron-left"></i></button>
                    <span class="monthNav__label" id="monthLabel">—</span>
                    <button data-action="next-month" aria-label="Next month"><i data-lucide="chevron-right"></i></button>
                </div>
                <button class="btn btn--ghost btn--sm" data-action="today"><i data-lucide="calendar-check"></i> Today</button>

                <div class="searchBox">
                    <i data-lucide="search"></i>
                    <input type="search" id="search" placeholder="Search a designer or a topic…" aria-label="Search designers and topics" />
                    <kbd>/</kbd>
                    <button id="searchClear" hidden aria-label="Clear search"><i data-lucide="x"></i></button>
                </div>
            </div>

            <div class="chips" id="filterChips" role="group" aria-label="Filter slots">
                <button class="chip is-active" data-filter="all" aria-pressed="true">All</button>
                <button class="chip" data-filter="open" aria-pressed="false">Open</button>
                <button class="chip" data-filter="review" aria-pressed="false">In review</button>
                <button class="chip" data-filter="approved" aria-pressed="false">Approved</button>
                <button class="chip" data-filter="attention" aria-pressed="false">Needs attention</button>
                <button class="chip" data-filter="locked" aria-pressed="false">Locked</button>
            </div>

            <div class="statsRow" id="statsRow"></div>
            <div class="grid" id="grid"></div>
        </section>

        <!-- ───────────────────────────────────────── roster ── -->
        <section id="view-roster" role="tabpanel" aria-label="Roster" class="stack" hidden>
            <div class="panel">
                <h3 class="panel__title"><i data-lucide="users-round"></i> Rotation &amp; reliability</h3>
                <div id="rosterBody"></div>
            </div>
        </section>

        <!-- ─────────────────────────────────────── controls ── -->
        <section id="view-controls" role="tabpanel" aria-label="Controls" class="stack" hidden>
            <div id="controlsBody" class="stack"></div>
        </section>

        <!-- ───────────────────────────────────────── backup ── -->
        <section id="view-backup" role="tabpanel" aria-label="Backup" class="stack" hidden>
            <div id="backupBody" class="stack"></div>
        </section>

        <!-- ─────────────────────────────────────── activity ── -->
        <section id="view-activity" role="tabpanel" aria-label="Activity" class="stack" hidden>
            <div class="panel">
                <h3 class="panel__title"><i data-lucide="scroll-text"></i> Audit log</h3>
                <div id="activityBody"></div>
            </div>
        </section>

    </main>

    <!-- ────────────────────────────────────────── overlays ── -->
    <div class="busy" id="busyOverlay" role="status" aria-live="polite">
        <div class="busy__box">
            <div class="spinner"></div>
            <div>
                <div class="busy__title">Working…</div>
                <div class="busy__subtitle"></div>
            </div>
        </div>
    </div>

    <div class="toastStack" id="toastStack" aria-live="polite"></div>

    <!-- ─────────────────────────────────────────── vendor ── -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <!-- ────────────────────────────────────────────── app ── -->
    <script src="js/config.js"></script>
    <script src="js/util.js"></script>
    <script src="js/schedule.js"></script>
    <script src="js/store.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/images.js"></script>
    <script src="js/backup.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
